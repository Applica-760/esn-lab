schema_version: 1
task:
  id: TASK-002
  state: completed
  title: 2クラスESN出力によるその他のマージン分布分析
  objective: 採食・反芻の2クラスESNへ採食・反芻・その他を入力し、真値3群の出力マージン分布を比較して、その他が既知2クラスと異なる出力傾向を示すかを記述する。
  approach:
  - 研究上の入力は research-hub:docs/research/20260729_other-margin-analysis.md とする。出力マージン比較に限定し、閾値の採用、棄却・分類、再学習・分類器改変、Energy/PCA/Mahalanobisは対象外とする。
  - 2クラスモデルの出力は維持したまま、ID・fold・真値3群を保持する推論専用経路と、真値3群で集計する専用解析を追加する。既存の2クラス・3クラス解析は変更しない。
  - research-hub:docs/operations/research-workflow.md と docs/operations/supercomputer-execution.md
    に従い、スパコン実行前にcommit・設定・出力先・再現手順を記録する。
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
