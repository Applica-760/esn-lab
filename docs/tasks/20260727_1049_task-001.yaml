schema_version: 1
task:
  id: TASK-001
  state: draft
  title: 2クラスESN出力によるその他のマージン分布分析
  objective: 採食・反芻の2クラスESNに採食・反芻・その他を入力し、真の行動別の出力マージン分布を比較して、その他が既知2クラスと分離可能かを検証する。
  approach:
  - '研究上の入力: research-hub:TASK-002で整理する理論・引用元・その他データの定義・実験仮説を参照する。プロジェクト間のTask依存関係は作成しない。'
  - '既存実装の流用: projects/tasks/pred/app.py と src/esn_lab/runner/pred/tenfold.py で10-fold・group単位の出力生値を取得し、projects/utils/prediction.py
    のNPZ保存形式を用いる。projects/tasks/analysis/pred/app.py の analyze_score_margin の算出式を流用する。'
  - '実装方針: 既存 analysis.pred は予測出力数と真値クラス数が同一であることを前提にするため変更しない。2出力の予測を、採食・反芻・その他の3つの真値群で集計する専用解析と設定を追加する。任意の閾値の採用・分類器の改変は行わない。'
  - '実行経路: research-hub:docs/operations/research-workflow.md と docs/operations/supercomputer-execution.md
    に従う。スパコン実行前に日付付き実行指示書を作成し、そこで指定したpush済みcommitを用いる。結果・config.lock・実行commitをローカルへ取得して検証する。'
  - '報告への引継ぎ: 実験成果物の確定パス・再現手順・解釈を記録した後、research-hubに報告資料作成Taskを起票する。そのTaskのApproachは本Task（esn-lab:TASK-001）と成果物パスを参照し、本TaskのPhase
    logには起票したresearch-hub Task IDを記録して双方向に追跡可能にする。'
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
