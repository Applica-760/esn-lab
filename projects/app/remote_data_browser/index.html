<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>リモートデータ取得</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header><h1>リモートデータ取得</h1><p>ディレクトリを選択し、Enterで取得内容を確認します。</p></header>
  <main>
    <p id="status" role="status" aria-live="polite">接続設定を読み込んでいます…</p>
    <p id="error" role="alert" hidden></p>
    <fieldset id="browser" disabled>
      <legend>1. ディレクトリを選択</legend>
      <dl><dt>リモートルート</dt><dd id="remote-root"></dd><dt>ローカル保存先</dt><dd id="local-root"></dd></dl>
      <div class="toolbar"><button id="parent" type="button">親へ戻る</button><button id="refresh" type="button">再読み込み</button></div>
      <h2 id="current"></h2>
      <div id="entries" role="group" aria-label="取得するディレクトリ"></div>
      <div class="selection"><p>選択中：<strong id="selected">未選択</strong></p><button id="enter" type="button" disabled>Enter — 取得内容を確認</button></div>
    </fieldset>
    <section id="confirmation" aria-labelledby="confirmation-title" hidden>
      <h2 id="confirmation-title" tabindex="-1">2. 取得内容を確認</h2>
      <dl><dt>取得元</dt><dd id="source"></dd><dt>保存先</dt><dd id="destination"></dd><dt>ファイル数</dt><dd id="file-count"></dd></dl>
      <div id="collision-warning" class="warning" hidden><h3>同名のファイルがあります</h3><p>次のローカルファイルを上書きします。続行しますか？</p><ul id="conflicts"></ul></div>
      <details id="skipped-section" hidden><summary>取得しない項目（リンク・特殊ファイル）</summary><ul id="skipped"></ul></details>
      <div class="toolbar"><button id="cancel" type="button">選択に戻る</button><button id="confirm" type="button">取得する</button></div>
    </section>
    <p class="note">リモートのファイルは残ります。転送中は画面を閉じても転送が続きます。</p>
  </main>
</body>
</html>
